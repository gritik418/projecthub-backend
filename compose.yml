services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: projecthub-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - db

  db:
    image: postgres:16-alpine

    container_name: projecthub-db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: project123
      POSTGRES_DB: projecthub

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
